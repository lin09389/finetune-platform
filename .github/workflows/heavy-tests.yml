name: Heavy Path Tests

# Complementary execution track for the backend test cases excluded from
# ci.yml's minimal-dependency backend-test job. The case set below must stay
# exactly complementary to (and sourced from) the --ignore/--deselect args of
# the "Run unit tests" step in ci.yml — update both files together whenever
# either list changes.

on:
  workflow_dispatch:
  schedule:
    # Weekly safety net so drift between this case set and the ci.yml
    # exclusion list surfaces without waiting for a manual trigger.
    - cron: '0 3 * * 1'

concurrency:
  group: heavy-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  heavy-backend-test:
    name: Heavy Backend Tests (full extras)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # torch==2.2.2+cu121 plus its nvidia-* wheels occupy several GB;
      # reclaim preinstalled toolchains so the runner disk does not fill up.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Full-dependency caliber (same as the local reproduction path in
      # AGENTS.md 「测试」): all extras, so torch / aiohttp / pynput resolve.
      - name: Install dependencies
        run: |
          uv sync --frozen --extra all --extra dev

      # pynput's Linux backend needs an X display even for imports; xvfb-run
      # provides a virtual one. The cua tests only exercise unit-level logic
      # (no real input devices), so a virtual display is sufficient.
      - name: Install xvfb (virtual display for pynput)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # Case set = exactly the --ignore/--deselect exclusions of ci.yml's
      # "Run unit tests" step:
      # - test_cua.py, test_architecture_cleanup.py: import pynput (cua
      #   extra); runnable here under xvfb-run's virtual display
      # - test_openai_compatible_api.py: imports aiohttp (inference extra)
      # - 2 native inference-service boundary tests and the backend-aware
      #   tool facts test: require torch at runtime; the cu121 wheel executes
      #   on CPU, so no case in the excluded set needs a GPU and none has to
      #   stay excluded on this CPU-only runner.
      - name: Run heavy path tests (ci.yml excluded set)
        run: |
          xvfb-run -a uv run pytest \
            server/tests/test_cua.py \
            server/tests/test_architecture_cleanup.py \
            server/tests/test_openai_compatible_api.py \
            "server/tests/test_inference_service_boundary.py::test_native_inference_service_requires_internal_authentication" \
            "server/tests/test_inference_service_boundary.py::test_native_inference_capability_contract" \
            "server/tests/test_phase0_capability_fact_source.py::test_inference_capabilities_backend_aware_tool_facts" \
            -v --tb=short
