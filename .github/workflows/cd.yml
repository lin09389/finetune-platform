name: CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-before-deploy:
    name: Pre-deploy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        run: |
          uv sync --frozen --extra dev --extra agent

      - name: Run smoke tests
        run: |
          uv run pytest server/tests/test_training.py server/tests/test_gateway_api_signature_contract.py server/tests/test_device.py server/tests/test_models.py server/tests/test_datasets.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        run: |
          cd client
          npm ci
          npm run typecheck
          npm run build

  build-and-push:
    name: Build and Push Docker Image
    needs: test-before-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Delivery surface: this repository has no hosted staging/production environment
  # to deploy to. CD's real, automated delivery is the container image published
  # above to ${REGISTRY}/${IMAGE_NAME} on ghcr.io. Operators self-host it via
  # docker-compose.yml; desktop (Electron) distribution is packaged and signed
  # through a separate release-operations workflow (see docs/desktop-packaging.md).
  #
  # Earlier revisions carried deploy-staging / deploy-production / post-deploy-verify
  # jobs that were non-functional scaffolding: they only echoed messages and ran
  # scripts/verify_docker_release.py against a fabricated placeholder host behind a
  # trailing shell guard that swallowed every failure, so they could never actually
  # fail. They have been removed rather than left as misleading placeholders.
  #
  # To verify a real stack, run `docker compose up` and then
  # scripts/verify_docker_release.py, which targets localhost by default and exits
  # non-zero when any core surface is unreachable.
