name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ── Gate: encoding & lint hygiene ──────────────────────────────
  lint:
    name: Lint & Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install tools
        run: |
          uv sync --frozen --extra dev

      - name: Check encoding hygiene
        run: uv run python scripts/check_encoding.py

      - name: Ruff (focused gate)
        run: uv run ruff check server --select W291,W293,I001,UP015,UP012 --output-format=github

      - name: Ruff (full lint - advisory)
        run: uv run ruff check server --output-format=github
        continue-on-error: true

      - name: Black format check
        run: uv run black --check server
        continue-on-error: true

      - name: MyPy type check
        run: uv run mypy server --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ── Backend unit tests ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Run unit tests
        run: |
          uv run pytest server/tests/ -v --tb=short -m "not integration and not e2e" --cov=server --cov-report=xml --cov-report=term-missing

      - name: Run smoke tests (always)
        if: always()
        run: |
          uv run pytest server/tests/test_training.py server/tests/test_gateway_api_signature_contract.py server/tests/test_device.py server/tests/test_datasets.py server/tests/test_models.py -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ── Backend integration tests ────────────────────────────────────
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Run integration tests
        run: |
          uv run pytest server/tests/ -v --tb=short -m "integration" --cov=server --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: integration
          fail_ci_if_error: false

  # ── Frontend ─────────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: TypeScript check
        run: cd client && npm run typecheck

      - name: Lint
        run: cd client && npm run lint
        continue-on-error: true

      - name: Run tests
        run: cd client && npx vitest run --reporter=basic

      - name: Build
        run: cd client && npm run build

  # ── Security ─────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install safety
        run: pip install safety

      - name: Check Python dependencies
        run: |
          cd server
          safety check -r requirements.txt 2>/dev/null || safety scan -r requirements.txt || true
