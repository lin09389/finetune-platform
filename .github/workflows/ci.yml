name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ── Gate: encoding & lint hygiene ──────────────────────────────
  lint:
    name: Lint & Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No pip cache: dependencies are installed via uv (setup-uv has its own
      # cache); cache: 'pip' fails the post step when pip is never invoked.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install tools
        run: |
          uv sync --frozen --extra dev

      - name: Check encoding hygiene
        run: uv run python scripts/check_encoding.py

      - name: Ruff (focused gate)
        run: uv run ruff check server --select W291,W293,I001,UP015,UP012 --output-format=github

      # Blocking: server/security/ is fully ruff-clean and must stay that way.
      - name: Ruff (server/security blocking gate)
        run: uv run --extra dev --extra agent python -m ruff check server/security/ --output-format=github

      # Blocking: server/security/ (plus its followed core/memory imports) is
      # mypy-clean and must stay that way.
      - name: MyPy (server/security blocking gate)
        run: uv run --extra dev --extra agent python -m mypy server/security/

      # Advisory (non-blocking): the full ruff surface still reports
      # pre-existing violations (I001/W293/UP*, 200+) beyond the focused
      # blocking gate above. Kept advisory until the backlog is remediated.
      # Remediation cadence (single source of truth mirrored in AGENTS.md
      # 「CI lint 门控口径」): next subtree to promote to blocking is
      # server/core/ (already partially covered via the security gate's
      # mypy follow-imports); promote once its standalone ruff + mypy runs
      # are zero-error locally.
      - name: Ruff (full lint) [advisory / non-blocking]
        run: uv run ruff check server --output-format=github
        continue-on-error: true

      # Advisory (non-blocking): server/ is not yet black-clean; enforcing
      # would fail CI. Kept advisory until formatting is normalized repo-wide.
      - name: Black format check [advisory / non-blocking]
        run: uv run black --check server
        continue-on-error: true

      # Advisory (non-blocking): mypy still reports type errors across server/.
      # Kept advisory until the type-annotation backlog is cleared.
      - name: MyPy type check [advisory / non-blocking]
        run: uv run mypy server --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ── Backend unit tests ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Minimal-dependency test caliber (documented in AGENTS.md 「测试」):
      # dev + agent extras only. Heavy/desktop extras (training/inference/cua:
      # torch, aiohttp, pynput) are NOT installed, so the tests listed under
      # "Coverage boundary" below are excluded here and must be run locally
      # with `uv sync --frozen --extra all --extra dev`.
      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --extra agent

      # Coverage boundary under minimal deps (single source of truth: the
      # --ignore/--deselect args below; AGENTS.md 「测试」 links here):
      # - test_cua.py, test_architecture_cleanup.py: import pynput (cua extra;
      #   also unusable on headless runners)
      # - test_openai_compatible_api.py: imports aiohttp (inference extra)
      # - test_inference_service_boundary.py (2 tests) and
      #   test_phase0_capability_fact_source.py::test_inference_capabilities_backend_aware_tool_facts
      #   require torch at runtime
      # NOTE: --deselect nodeids are relative to pytest rootdir (server/, per
      # server/pytest.ini); --ignore paths are filesystem paths.
      - name: Run unit tests
        run: |
          uv run pytest server/tests/ -v --tb=short -m "not integration and not e2e" \
            --ignore=server/tests/test_cua.py \
            --ignore=server/tests/test_architecture_cleanup.py \
            --ignore=server/tests/test_openai_compatible_api.py \
            --deselect "tests/test_inference_service_boundary.py::test_native_inference_service_requires_internal_authentication" \
            --deselect "tests/test_inference_service_boundary.py::test_native_inference_capability_contract" \
            --deselect "tests/test_phase0_capability_fact_source.py::test_inference_capabilities_backend_aware_tool_facts" \
            --cov=server --cov-report=xml --cov-report=term-missing

      - name: Run smoke tests (always)
        if: always()
        run: |
          uv run pytest server/tests/test_training.py server/tests/test_gateway_api_signature_contract.py server/tests/test_device.py server/tests/test_datasets.py server/tests/test_models.py -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ── Backend integration tests ────────────────────────────────────
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Same minimal caliber as backend-test; integration tests must not
      # depend on training/inference/cua extras (see AGENTS.md 「测试」).
      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --extra agent

      - name: Run integration tests
        run: |
          uv run pytest server/tests/ -v --tb=short -m "integration" --cov=server --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: integration
          fail_ci_if_error: false

  # ── Frontend ─────────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: TypeScript check
        run: cd client && npm run typecheck

      # Blocking gate: eslint errors fail CI. Warnings (e.g. no-explicit-any)
      # are reported but do not fail the run, so enforcement is safe today.
      - name: Lint
        run: cd client && npm run lint

      - name: Run tests
        run: cd client && npx vitest run --reporter=basic

      # TODO(P2-7): add Playwright Firefox smoke test for cross-browser coverage
      # and backdrop-filter fallback verification. See docs/ux-audit-2026-07-14.md §5.4.

      - name: Build
        run: cd client && npm run build

  # ── Security ─────────────────────────────────────────────────────
  # Advisory (non-blocking): dependency vulnerability scan is informational
  # and depends on external feeds (safety DB / network); kept non-blocking to
  # avoid flaky gating. Findings are surfaced in the job log for triage.
  security:
    name: Security Scan [advisory / non-blocking]
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install safety
        run: pip install safety

      - name: Check Python dependencies
        run: |
          cd server
          safety check -r requirements.txt 2>/dev/null || safety scan -r requirements.txt || true
