name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  encoding:
    name: Encoding Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Check encoding hygiene
        run: python scripts/check_encoding.py

  python_hygiene:
    name: Python Hygiene
    runs-on: ubuntu-latest
    needs: encoding
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run focused Ruff gate
        run: ruff check server --select W291,W293,I001,UP015,UP012 --output-format=github

  python_smoke:
    name: Python Smoke Tests
    runs-on: ubuntu-latest
    needs: python_hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -r server/requirements.txt

      - name: Run smoke tests
        run: |
          cd server
          pytest tests/test_training.py tests/test_gateway_api_signature_contract.py -q

  lint_advisory:
    name: Python Lint Advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: encoding
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black
          pip install -r server/requirements.txt
      
      - name: Run Ruff (Linter)
        run: |
          cd server
          ruff check . --output-format=github
      
      - name: Run Black (Format Check)
        run: |
          cd server
          black --check .
      
      - name: Run MyPy (Type Check)
        run: |
          cd server
          mypy . --ignore-missing-imports --no-error-summary

  test_advisory:
    name: Python Tests Advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: encoding
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -r server/requirements.txt
      
      - name: Run tests with coverage
        run: |
          cd server
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: encoding
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: |
          cd client
          npm ci
      
      - name: TypeScript check
        run: |
          cd client
          npm run typecheck
      
      - name: Build
        run: |
          cd client
          npm run build

  security_advisory:
    name: Security Advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: encoding
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install safety
        run: pip install safety
      
      - name: Check dependencies for vulnerabilities
        run: |
          cd server
          safety check -r requirements.txt
