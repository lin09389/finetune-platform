version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finetune-api
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
      LOG_FORMAT: text
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      OLLAMA_BASE_URL: http://ollama:11434
      MODELS_DIR: /app/models
      DATASETS_DIR: /app/datasets
      OUTPUTS_DIR: /app/outputs
      HF_HOME: /app/models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/models/sentence-transformers
      MODELSCOPE_CACHE_DIR: /app/models/modelscope_cache
      MAX_UPLOAD_SIZE: 104857600
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - finetune-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: finetune-frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - finetune-network
    restart: unless-stopped

  frontend-dev:
    image: node:20-slim
    container_name: finetune-frontend-dev
    working_dir: /app/client
    volumes:
      - ./client:/app/client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    networks:
      - finetune-network
    profiles:
      - dev

  ollama:
    image: ollama/ollama:latest
    container_name: finetune-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - finetune-network
    profiles:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  finetune-network:
    driver: bridge
