
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_EXTRAS: "--extra agent --extra rag --extra cua --extra modelhub --extra model-ops"
    container_name: finetune-api
    ports:
      - "8010:8010"
    environment:
      HOST: 0.0.0.0
      PORT: 8010
      LOG_LEVEL: INFO
      LOG_FORMAT: text
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80
      OLLAMA_BASE_URL: http://ollama:11434
      MODELS_DIR: /app/models
      DATASETS_DIR: /app/datasets
      OUTPUTS_DIR: /app/outputs
      HF_HOME: /app/models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/models/sentence-transformers
      MODELSCOPE_CACHE_DIR: /app/models/modelscope_cache
      MAX_UPLOAD_SIZE: 104857600
      TRAINING_EXECUTION_MODE: worker
      INFERENCE_EXECUTION_MODE: service
      INFERENCE_SERVICE_URL: http://inference-service:8020
      INFERENCE_INTERNAL_API_KEY: ${INFERENCE_INTERNAL_API_KEY:-finetune-local-inference-dev-key}
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - finetune-network
    restart: unless-stopped
    depends_on:
      training-worker:
        condition: service_started
      inference-service:
        condition: service_healthy

  training-worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        UV_EXTRAS: "--extra training --extra gpu"
    container_name: finetune-training-worker
    command: ["python", "-m", "server.training_worker"]
    environment:
      LOG_LEVEL: INFO
      LOG_FORMAT: text
      TRAINING_EXECUTION_MODE: worker
      MODELS_DIR: /app/models
      DATASETS_DIR: /app/datasets
      OUTPUTS_DIR: /app/outputs
      HF_HOME: /app/models/huggingface
      MODELSCOPE_CACHE_DIR: /app/models/modelscope_cache
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - finetune-network
    restart: unless-stopped

  inference-service:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        UV_EXTRAS: "--extra inference"
    container_name: finetune-inference-service
    command: ["python", "-m", "server.inference_server"]
    environment:
      LOG_LEVEL: INFO
      LOG_FORMAT: text
      INFERENCE_EXECUTION_MODE: in_process
      INFERENCE_SERVICE_HOST: 0.0.0.0
      INFERENCE_SERVICE_PORT: 8020
      INFERENCE_INTERNAL_API_KEY: ${INFERENCE_INTERNAL_API_KEY:-finetune-local-inference-dev-key}
      OLLAMA_BASE_URL: http://ollama:11434
      MODELS_DIR: /app/models
      DATASETS_DIR: /app/datasets
      OUTPUTS_DIR: /app/outputs
      HF_HOME: /app/models/huggingface
      MODELSCOPE_CACHE_DIR: /app/models/modelscope_cache
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finetune-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8010
    container_name: finetune-frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - finetune-network
    restart: unless-stopped

  frontend-dev:
    image: node:20-slim
    container_name: finetune-frontend-dev
    working_dir: /app/client
    volumes:
      - ./client:/app/client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8010
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    networks:
      - finetune-network
    profiles:
      - dev

  ollama:
    image: ollama/ollama:latest
    container_name: finetune-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - finetune-network
    profiles:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  finetune-network:
    driver: bridge
