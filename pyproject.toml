[project]
name = "finetune-platform"
version = "2.1.0"
description = "AI-powered fine-tuning platform with CUA and MCP integration"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ast-grep-cli>=0.42.1,<0.43",
    # ── Web framework ───────────────────────────────────────────────
    "fastapi==0.109.0",
    "starlette==0.35.1",
    "uvicorn>=0.30.0,<0.31",
    "pydantic>=2.10.0,<2.11",
    "pydantic-settings>=2.1.0,<2.2",
    "python-multipart>=0.0.6,<0.1",
    "python-dotenv>=1.0.0,<1.1",
    # ── DeepAgents / LangGraph agent framework ─────────────────────
    "deepagents>=0.6.3,<0.7",
    "langchain>=1.3.0,<2.0.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-deepseek>=1.0.0,<2.0.0",
    "langgraph>=1.2.0,<1.3.0",
    "langgraph-checkpoint-sqlite>=3.0.3,<3.1",
    "aiosqlite>=0.20,<0.21",
    "xxhash>=3.0,<4",
    # ── PyTorch (install GPU wheel separately when needed) ─────────
    "torch==2.2.2",
    "transformers==4.46.3",
    "accelerate==1.13.0",
    "peft==0.18.1",
    "llama-cpp-python>=0.2.79,<0.3",
    # ── Training and data ──────────────────────────────────────────
    "scipy==1.11.4",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",
    "datasets==3.6.0",
    "huggingface-hub==0.36.0",
    "safetensors==0.7.0",
    "pandas>=2.1,<3",  # structured table store (rag/structured/table_store.py)
    "modelscope>=1.10.0,<2",
    # ── Runtime utilities ──────────────────────────────────────────
    "psutil==5.9.8",
    "requests==2.32.5",
    "chardet==5.2.0",
    "httpx==0.28.1",  # runtime HTTP client (ai/gateway.py, inference scheduler)
    "aiofiles>=23.0,<24",  # async file I/O for evaluation runs (api/evaluation.py)
    "aiohttp>=3.9,<4",  # Ollama inference backend HTTP client (api/inference/backends/ollama.py)
    "anyio>=4.0,<5",  # async primitives (core/db_manager.py)
    # ── Screen capture and OCR ─────────────────────────────────────
    "mss==9.0.1",
    "Pillow==10.2.0",
    "pytesseract>=0.3.10,<0.4",
    # ── Keyboard and mouse input ───────────────────────────────────
    "pynput==1.7.6",
    "pyautogui>=0.9.54,<0.10",
    "pywin32>=305,<306; sys_platform == 'win32'",
    "pywinpty>=2.0.13,<3; sys_platform == 'win32'",
    # ── Logging ────────────────────────────────────────────────────
    "python-json-logger==2.0.7",
    "grpcio==1.71.0",
    "grpcio-tools==1.71.0",
    # ── Model export ───────────────────────────────────────────────
    "onnx==1.15.0",
    "onnxruntime==1.16.3",
    # ── Security ───────────────────────────────────────────────────
    "python-magic-bin==0.4.14; sys_platform == 'win32'",
    "python-magic==0.4.27; sys_platform != 'win32'",
    "bcrypt>=4.0.0,<5",
    "cryptography>=42.0,<46",  # Fernet encryption (security/encryption.py)
    # ── MCP and parsing ────────────────────────────────────────────
    "websockets>=14.0,<16",
    "pdfplumber>=0.10.0,<0.11",
    "pypdf>=4.0.0,<5",
    "python-docx>=1.1.0,<1.2",
    "openpyxl>=3.1.0,<3.2",
    # ── Scheduler and clipboard ────────────────────────────────────
    "croniter>=1.3.0,<2",
    "pyperclip>=1.8.2,<1.9",
    # ── RAG knowledge base ─────────────────────────────────────────
    "chromadb>=0.4.22,<0.5",
    "sentence-transformers==5.2.3",
    # ── OCR alternatives ───────────────────────────────────────────
    "rapidocr-onnxruntime==1.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.23.2",
    "ruff>=0.1.0,<0.2",
    "mypy>=1.0.0,<1.9",
    "black>=23.0.0,<24",
    "playwright>=1.40.0,<1.41",
    "safety>=2.0.0,<3",
]
gpu = [
    "bitsandbytes==0.41.3",
]

[tool.uv]
package = false  # not a publishable package; skip build-metadata strict checks

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "backup_old_modules",
    "data",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "B904",
    "ARG001",
    "ARG002",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "core", "cua", "mcp", "skills", "memory", "rag", "security", "context", "workspace", "ai", "backends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "backup_old_modules",
    "data",
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "pyautogui.*",
    "mss.*",
    "pytesseract.*",
    "PIL.*",
    "chromadb.*",
    "transformers.*",
    "torch.*",
    "playwright.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: marks tests as unit tests",
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["server"]
branch = true
omit = [
    "*/tests/*",
    "*/backup_old_modules/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 60
show_missing = true
skip_covered = true
